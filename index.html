<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->

      <input type="search" id="buscador" placeholder="buscar por nombre, provincia o categoria">

      <select id="filtrocategoria">
        <option value="">Todas las categorias</option>
        <option value="Parrila">parrilla</option>
        <option value="Frito">frito</option>
      </select>

      <select id="filtroprovincia">
        <option value="">Todas las categorias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Salta">Salta</option>
        <option value="Tucuman">Tucuman</option>
        <option value="Cordoba">Cordoba</option>
      </select>


    </header>


    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    

    <section class="espacioForm">
      <section class="addFood">

        <form id="agregar-comida-form">
          <h2>Agregar comida</h2>
          <label for="nombre">Nombre de comida</label>
          <input  id="nombre" type="text"  placeholder="nombre de la comida" required>
          <br>
          <label for="provincia">Provincia de comida</label>
          <input  id="provincia" type="text"  placeholder="provincia de la comida" required>
          <br>
          <label for="categoria">Categoria de comida</label>
          <input  id="categoria" type="text"  placeholder="categoria de la comida" required>
          <br>
          <label for="ingredientes">Ingredientes de comida</label>
  
  <div class="contenedor-ingredientes">
    <input  id="ingredientes" type="text" class="Ingrediente" placeholder="ingredientes de la comida" required>
  </div>
  
        <button type="button" id="buton-agregar-ingredientes">Agregar Ingredeinte</button>
  
          <button type="submit">Agregar</button>
        </form>
        <!-- Para el form para agregar comida -->
      </section>
    </section>
    


   
    <script type="module" src="./main.js"></script>
</body>
</html>
